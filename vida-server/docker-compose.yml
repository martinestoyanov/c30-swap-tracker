# VIDA content service for the C30 AWD Swap Tracker.
# Self-contained stack — separate compose project, own network, does NOT
# touch any existing services on this host. Deploy to /opt/vida-tracker.
#
#   caddy     — TLS for casitaor.duckdns.org:8443 via DNS-01 challenge
#               (DuckDNS API). NO ports 80/443 exposed at all.
#   vida-auth — FastAPI: verifies Firebase ID tokens, serves /content read-only
#
# Router (FreshTomato): single forward WAN TCP 8443 -> 192.168.1.10:8443.
# Cert issuance/renewal happens over DNS — no inbound HTTP needed.
#
# Requires .env alongside this file (never committed):
#   DUCKDNS_TOKEN=<token from https://www.duckdns.org>

services:
  vida-auth:
    build: ./app
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: c30-swap-tracker
      ALLOWED_EMAILS: "martin@c30swap.app;evi@c30swap.app"
      ALLOWED_ORIGINS: "https://martinestoyanov.github.io,http://localhost:8080,http://localhost:7100"
    volumes:
      - ./content:/content:ro
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8100:8000"  # host-local only: Tailscale Funnel proxies here

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
